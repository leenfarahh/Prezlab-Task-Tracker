<section class="board-section" id="board-container"
         {% if oob %}hx-swap-oob="true"{% endif %}
         hx-get="/partials/archived-projects" hx-trigger="every 5s" hx-swap="innerHTML">
  <div class="board-header">
    <h1>Archived projects</h1>
  </div>

  {% for p in projects %}
  <div class="task-card" style="display: flex; align-items: center; justify-content: space-between; cursor: default; max-width: 420px;">
    <div>
      <p class="task-card-title">{{ p.name }}</p>
      <p class="task-card-meta">{{ p.archived_workstream_count }} archived workstream{{ '' if p.archived_workstream_count == 1 else 's' }}</p>
    </div>
    <button type="button" class="btn-ghost"
            hx-post="/projects/{{ p.id }}/unarchive"
            hx-target="#modal-root" hx-swap="innerHTML">
      Unarchive
    </button>
  </div>
  {% else %}
  <p class="empty-column">Nothing archived.</p>
  {% endfor %}
</section>
