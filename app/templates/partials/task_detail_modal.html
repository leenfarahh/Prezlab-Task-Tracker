<div class="modal-backdrop" id="modal-root-inner" onclick="if(event.target === this) htmx.trigger('#modal-close-detail', 'click')">
  <form class="modal-card" hx-post="/tasks/{{ task.id }}" hx-target="#modal-root" hx-swap="innerHTML" onclick="event.stopPropagation()">
    <div class="modal-head">
      <p class="eyebrow">Edit task</p>
      <button type="button" id="modal-close-detail" class="icon-btn modal-close" aria-label="Close"
              hx-get="/partials/empty" hx-target="#modal-root" hx-swap="innerHTML">&times;</button>
    </div>

    <input type="hidden" name="active_workstream" value="{{ active_workstream }}" />
    <input type="hidden" name="active_project" value="{{ active_project }}" />
    <input name="title" required value="{{ task.title }}" autofocus />

    <div class="modal-row">
      <div>
        <label>Status</label>
        <select name="status">
          {% for status in status_order %}
          <option value="{{ status }}" {{ 'selected' if status == task.status else '' }}>{{ status_label[status] }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Owner</label>
        <select name="assignee_id">
          <option value="">Unassigned</option>
          {% for p in profiles %}
          <option value="{{ p.id }}" {{ 'selected' if p.id == task.assignee_id else '' }}>{{ p.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="modal-row">
      <select name="priority">
        <option value="low" {{ 'selected' if task.priority == 'low' else '' }}>Low priority</option>
        <option value="medium" {{ 'selected' if task.priority == 'medium' else '' }}>Medium priority</option>
        <option value="high" {{ 'selected' if task.priority == 'high' else '' }}>High priority</option>
        <option value="urgent" {{ 'selected' if task.priority == 'urgent' else '' }}>Urgent</option>
      </select>
      <input type="date" name="due_date" value="{{ task.due_date or '' }}" />
    </div>

    <div class="modal-actions" style="justify-content: space-between;">
      <details class="modal-menu">
        <summary aria-label="More actions" title="More actions">&#9776;</summary>
        <div class="modal-menu-list">
          {% if task.is_archived %}
          <button type="button" class="modal-menu-item"
                  hx-post="/tasks/{{ task.id }}/unarchive" hx-vals='{"active_workstream": "{{ active_workstream }}", "active_project": "{{ active_project }}"}'
                  hx-target="#modal-root" hx-swap="innerHTML">
            Unarchive task
          </button>
          {% else %}
          <button type="button" class="modal-menu-item"
                  hx-post="/tasks/{{ task.id }}/archive" hx-vals='{"active_workstream": "{{ active_workstream }}", "active_project": "{{ active_project }}"}'
                  hx-target="#modal-root" hx-swap="innerHTML">
            Archive task
          </button>
          {% endif %}
          <button type="button" class="modal-menu-item danger"
                  hx-get="/partials/confirm-delete-task-modal?task_id={{ task.id }}&active_workstream={{ active_workstream }}&active_project={{ active_project }}"
                  hx-target="#modal-root" hx-swap="innerHTML">
            Delete task
          </button>
        </div>
      </details>
      <button type="submit" class="btn-primary">Save changes</button>
    </div>
  </form>
</div>
