{% macro task_card(task, assignee, priority_label, priority_color, active_workstream, active_project, flagged=False) -%}
<button class="task-card status-{{ task.status }} {{ 'flagged' if flagged else '' }}"
        hx-get="/partials/task-detail-modal?task_id={{ task.id }}&workstream={{ active_workstream }}&project={{ active_project }}" hx-target="#modal-root" hx-swap="innerHTML">
  {% if active_project in ("all", "archived", "by_user") and task.project_name %}
  <p class="project-tag">{{ task.project_name }}</p>
  {% endif %}
  <p class="task-card-title">{{ task.title }}</p>
  <div class="task-card-meta">
    <span class="priority-pill" style="background-color: {{ priority_color }};">{{ priority_label }}</span>
    {% if task.due_date_display %}
      <span class="{{ 'overdue' if task.overdue else '' }}">{{ 'Overdue ' if task.overdue else 'Due ' }}{{ task.due_date_display }}</span>
    {% endif %}
    {% if assignee %}
      {% if assignee.avatar_url %}
      <img src="{{ assignee.avatar_url }}" alt="{{ assignee.full_name }}" title="{{ assignee.full_name }}" class="avatar-img" />
      {% else %}
      <span class="avatar" style="background-color: {{ assignee.avatar_color }};" title="{{ assignee.full_name }}">{{ assignee.initials }}</span>
      {% endif %}
    {% endif %}
  </div>
</button>
{%- endmacro %}
