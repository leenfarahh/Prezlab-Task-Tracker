<div class="modal-backdrop" id="modal-root-inner" onclick="if(event.target === this) htmx.trigger('#modal-close-edit-project', 'click')">
  <form class="modal-card" hx-post="/projects/{{ project.id }}" hx-target="#modal-root" hx-swap="innerHTML" onclick="event.stopPropagation()">
    <p class="eyebrow" style="margin-bottom: 12px;">Edit project</p>
    <input type="hidden" name="active_workstream" value="{{ active_workstream }}" />
    <input type="hidden" name="active_project" value="{{ active_project }}" />

    <input name="name" required placeholder="Project name" value="{{ project.name }}" autofocus />

    {# Both destructive actions moved behind the overflow menu, matching the task
       modal - Delete is irreversible and has no business sitting one mis-click
       from Save changes. #}
    <div class="modal-actions" style="justify-content: space-between;">
      <details class="modal-menu">
        <summary aria-label="More actions" title="More actions">&#9776;</summary>
        <div class="modal-menu-list">
          <button type="button" class="modal-menu-item"
                  hx-get="/partials/confirm-archive-project-modal?project_id={{ project.id }}&active_workstream={{ active_workstream }}&active_project={{ active_project }}"
                  hx-target="#modal-root" hx-swap="innerHTML">
            Archive project
          </button>
          <button type="button" class="modal-menu-item danger"
                  hx-get="/partials/confirm-delete-project-modal?project_id={{ project.id }}&active_workstream={{ active_workstream }}&active_project={{ active_project }}"
                  hx-target="#modal-root" hx-swap="innerHTML">
            Delete project
          </button>
        </div>
      </details>
      <div style="display: flex; gap: 8px;">
        <button type="button" id="modal-close-edit-project" class="link-muted" hx-get="/partials/empty" hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
        <button type="submit" class="btn-primary">Save changes</button>
      </div>
    </div>
  </form>
</div>
