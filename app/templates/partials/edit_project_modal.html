<div class="modal-backdrop" id="modal-root-inner" onclick="if(event.target === this) htmx.trigger('#modal-close-edit-project', 'click')">
  <form class="modal-card" hx-post="/projects/{{ project.id }}" hx-target="#modal-root" hx-swap="innerHTML" onclick="event.stopPropagation()">
    <p class="eyebrow" style="margin-bottom: 12px;">Edit project</p>
    <input type="hidden" name="active_project" value="{{ active_project }}" />

    <input name="name" required placeholder="Project name" value="{{ project.name }}" autofocus />

    <div class="modal-actions" style="justify-content: space-between;">
      <button type="button" class="link-muted" style="color: var(--blocked);"
              hx-post="/projects/{{ project.id }}/archive" hx-vals='{"active_project": "{{ active_project }}"}'
              hx-target="#modal-root" hx-swap="innerHTML"
              hx-confirm="Archive this project? It'll be hidden from the sidebar and board, and its workstreams and tasks will be archived along with it.">
        Archive
      </button>
      <div style="display: flex; gap: 8px;">
        <button type="button" id="modal-close-edit-project" class="link-muted" hx-get="/partials/empty" hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
        <button type="submit" class="btn-primary">Save changes</button>
      </div>
    </div>
  </form>
</div>
