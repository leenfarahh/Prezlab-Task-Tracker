{% import "partials/health_strip.html" as hs %}
<aside class="sidebar" id="sidebar-container"
       {% if oob %}hx-swap-oob="true"{% endif %}
       hx-get="/partials/sidebar?workstream={{ active_workstream }}" hx-trigger="every 6s" hx-swap="innerHTML">
  <p class="eyebrow" style="margin-bottom: 16px;">Prezlab AI Team</p>

  <a href="/?workstream=all" hx-boost="true"
     class="sidebar-item {{ 'active' if active_workstream == 'all' else '' }}">
    All workstreams
  </a>

  <div style="margin-top: 8px;">
    {% for ws in workstreams %}
    <div class="sidebar-row {{ 'active' if active_workstream == ws.id else '' }}">
      <a href="/?workstream={{ ws.id }}" hx-boost="true" class="sidebar-item" style="flex: 1;">
        <span>{{ ws.name }}</span>
        {{ hs.health_strip(ws.segments) }}
      </a>
      <button type="button" class="link-muted" style="padding: 4px 6px; font-size: 12px; flex-shrink: 0;"
              hx-get="/partials/edit-workstream-modal?workstream_id={{ ws.id }}&active_workstream={{ active_workstream }}"
              hx-target="#modal-root" hx-swap="innerHTML" title="Edit workstream">
        Edit
      </button>
    </div>
    {% endfor %}
  </div>

  {% if active_workstream not in ("archived", "archived_workstreams") %}
  <button class="btn-ghost" style="width: 100%; margin-top: 12px;"
          hx-get="/partials/new-workstream-modal?active_workstream={{ active_workstream }}"
          hx-target="#modal-root" hx-swap="innerHTML">
    + New workstream
  </button>
  {% endif %}

  <a href="/archived" hx-boost="true"
     class="sidebar-item {{ 'active' if active_workstream == 'archived' else '' }}"
     style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line);">
    Archived tasks
  </a>
  <a href="/archived-workstreams" hx-boost="true"
     class="sidebar-item {{ 'active' if active_workstream == 'archived_workstreams' else '' }}">
    Archived workstreams
  </a>
</aside>
