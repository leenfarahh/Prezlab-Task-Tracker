{% extends "base.html" %}
{% block body %}
<main class="layout">
  <aside class="sidebar" id="sidebar-container">
    <div class="sidebar-head">
      <img src="/static/logo.png" alt="Prezlab" class="logo-mark" />
      <button type="button" class="icon-btn" onclick="toggleSidebar()" title="Collapse sidebar">&#10094;</button>
    </div>
    <div id="sidebar-body"
         hx-get="/partials/sidebar?workstream={{ active_workstream }}&project={{ active_project }}"
         hx-trigger="every 6s" hx-swap="morph:innerHTML">
      {% include "partials/sidebar.html" %}
    </div>
  </aside>
  <div class="board-wrap">
    <div class="board-utility">
      <button type="button" class="sidebar-expand-btn" onclick="toggleSidebar()" title="Expand sidebar">&#9776;</button>
      {% if viewer %}
      <a href="/users/{{ viewer.id }}" class="profile-btn" title="{{ viewer.full_name }}">
        {% if viewer.avatar_url %}
        <img src="{{ viewer.avatar_url }}" alt="{{ viewer.full_name }}" class="profile-avatar-img" />
        {% else %}
        <span class="avatar profile-avatar" style="background-color: {{ viewer.avatar_color }};">{{ viewer.initials }}</span>
        {% endif %}
      </a>
      {% endif %}
    </div>
    {% include board_template %}
  </div>
</main>
<div id="modal-root"></div>
{% endblock %}
