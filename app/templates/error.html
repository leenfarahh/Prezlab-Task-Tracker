{% extends "base.html" %}
{% block body %}
<main class="login-page">
  <div class="login-card">
    <p class="eyebrow">Pulse</p>
    <h1 style="font-size: 20px; margin: 4px 0 8px;">Something didn't load</h1>
    <div class="notice-box">
      The app couldn't reach a service it depends on. If this keeps happening, check that the
      Supabase environment variables are set correctly for this deployment.
    </div>
    <p style="font-size: 13px; color: var(--muted-faint); margin-top: 16px;">
      <a href="/">Try again</a>
    </p>
  </div>
</main>
{% endblock %}
